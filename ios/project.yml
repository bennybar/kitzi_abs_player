name: Kitzi
options:
  bundleIdPrefix: com.bennybar
  deploymentTarget:
    iOS: "26.1"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    # Same Apple team and signing as the Luli (Reddit) app.
    DEVELOPMENT_TEAM: 57L2ULXB7Z
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "2.0.364"
    CURRENT_PROJECT_VERSION: "364"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Kitzi:
    type: application
    platform: iOS
    sources:
      - path: Kitzi
      - path: Shared
      - path: WatchLink
    dependencies:
      - target: KitziActivity
      - target: KitziWatch
    info:
      path: Kitzi/Info.plist
      properties:
        CFBundleDisplayName: Kitzi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [com.bennybar.kitzi.progress-push, com.bennybar.kitzi.library-refresh]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        # Self-hosted Audiobookshelf servers are often plain http on a LAN.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Kitzi connects to your Audiobookshelf server on your local network.
        CFBundleURLTypes:
          - CFBundleURLName: com.bennybar.kitzi.oauth
            CFBundleURLSchemes: [kitzi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bennybar.kitzi
        PRODUCT_NAME: Kitzi
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  KitziActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: KitziActivity
      - path: Shared
    info:
      path: KitziActivity/Info.plist
      properties:
        CFBundleDisplayName: Kitzi Downloads
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bennybar.kitzi.activity
        PRODUCT_NAME: KitziActivity
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
  KitziWatch:
    type: application
    platform: watchOS
    sources:
      - path: KitziWatch
      - path: WatchLink
      - path: KitziWatchWidget/WidgetBook.swift
      # The iPhone app's server, sign-in and model code, shared as is.
      - path: Kitzi/Core/JSON.swift
      - path: Kitzi/Core/Models.swift
      - path: Kitzi/Core/API.swift
      - path: Kitzi/Core/Session.swift
    dependencies:
      - target: KitziWatchWidget
      - sdk: AppIntents.framework
    entitlements:
      path: KitziWatch/KitziWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bennybar.kitzi]
    info:
      path: KitziWatch/Info.plist
      properties:
        CFBundleDisplayName: Kitzi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.bennybar.kitzi
        WKRunsIndependentlyOfCompanionApp: true
        UIBackgroundModes: [audio]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bennybar.kitzi.watchkitapp
        PRODUCT_NAME: KitziWatch
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  KitziWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: KitziWatchWidget
    entitlements:
      path: KitziWatchWidget/KitziWatchWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.bennybar.kitzi]
    info:
      path: KitziWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Kitzi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bennybar.kitzi.watchkitapp.widget
        PRODUCT_NAME: KitziWatchWidget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
